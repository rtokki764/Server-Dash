# ==========================================================
#  (옛 방식 · 선택) 요즘은 대시보드 🔔 알림 칸의 [+ 받을 곳 추가] 로 하는 게 더 쉬워.
#  이 파일에 적은 mattermost / telegram 도 계속 동작은 해.
#  알림 받을 곳 (비밀 정보) — 이 파일을 secrets.yaml 로 복사해서 채워
#    cp secrets.example.yaml secrets.yaml && chmod 600 secrets.yaml
#  secrets.yaml 은 zip 에 안 들어가고, install.sh 가 덮어쓰지도 않아
#  빈칸("")으로 두면 그 곳으로는 안 보내. 고친 뒤 재시작 필요 없음 → [테스트 알림 보내기]
# ==========================================================

mattermost:
  # Mattermost → 통합(Integrations) → 수신 웹훅(Incoming Webhooks) → 추가 → 채널 고르고 저장 → 나온 주소 붙여넣기
  webhook_url: ""          # 예: https://mm.example.com/hooks/abcd1234...
  username: "BC250"        # 보낸 사람 이름 (서버 설정에서 '웹훅 이름 바꾸기 허용'이 켜져 있어야 적용)
  # channel: "town-square" # 비우면 웹훅 만들 때 고른 채널로 감

telegram:
  # @BotFather 에서 /newbot 으로 만든 봇 토큰
  bot_token: ""            # 예: 123456789:AAH...
  # 봇한테 아무 말이나 보낸 뒤 https://api.telegram.org/bot<토큰>/getUpdates 에서 "chat":{"id": 숫자} 확인
  chat_id: ""
