# ==========================================================
#  서버 대시보드 최소 설정 (처음 설치할 때 이 파일이 config.yaml 로 복사돼)
#  - 아래 services 목록만 내 서버에 맞게 고치면 바로 쓸 수 있어
#  - 센서·hermes·watchdog 같은 건 없어도 돼 (없으면 그 부분만 조용히 빠짐)
#  - 들여쓰기(스페이스 2칸)가 틀리면 에러가 나니까 조심!
# ==========================================================

dashboard:
  title: ""              # 비워 두면 서버 hostname 이 제목이 돼
  host: 127.0.0.1        # 자기 자신만 접속 가능 (밖에서 보려면 터널/리버스 프록시 + 로그인 보호)
  port: 5070
  refresh_seconds: 5
  history_hours: 6
  sample_seconds: 60
  ack_metric_hours: 24

# 서비스 제어 버튼 (start/stop/restart/enable/disable). 로그인 보호 없이 인터넷에 열 거면 false!
control:
  enabled: true
  max_password_fails: 3
  lock_seconds: 300

notify:
  enabled: false         # 알림을 쓰려면 true (또는 화면 🔔 칸에서 켜기) + 화면에서 '받을 곳' 추가
  # 아래 값은 전부 대시보드 화면 🔔 알림 칸에서 바로 바꿀 수 있어 (화면에서 바꾼 값이 이 파일보다 우선).
  # allow_insecure_edit: false   # true 면 인터넷 쪽 http 접속에서도 웹훅 주소·토큰 저장 허용 (비추천)
  # bad_seconds: 60          # 빨강이 이만큼(초) 넘게 계속되면 보냄
  # warn_seconds: 600        # 노랑이 이만큼(초) 넘게 계속되면 보냄
  # cooldown_minutes: 30     # 같은 문제는 이 시간 안에 다시 안 보냄
  # send_resolved: true      # 해결 알림도 보낼지
  # link: https://내-대시보드-주소   # 알림 끝에 붙일 주소
  # quiet_hours: { start: "00:00", end: "08:00" }   # 조용한 시간 (tz 를 안 적으면 서버 시간대)
  # mute: []                 # 알림 끌 이름표

# 경고 기준 (생략하면 기본값: 메모리 85/95%, 스왑 70/90%, 디스크 80/90%, 온도 80/90°C)
# thresholds:
#   mem_pct: { warn: 85, bad: 95 }

# 온도·GPU 센서 (있는 서버만). sensors 명령에 나오는 칩 이름과 라벨을 적어 줘
# sensors:
#   apu_temp: { chip: k10temp, label: Tctl }
#   gpu_temp: { chip: amdgpu,  label: edge }

# 화면 위에 고정해서 볼 서비스
#   scope: system(기본) / user(--user) / manual(systemd 아님, port 로만 확인)
#   unit 을 생략하면 <name>.service 로 봐
services:
  - name: sshd
    unit: sshd.service      # 배포판에 따라 ssh.service 일 수 있어
    scope: system
    port: 22

known_processes: []
hidden_units: []
remote: []

# ---------------------------------------------------------------
#  (선택) 센서 — 안 적어도 AMD APU/GPU 는 자동으로 찾아 (BC250 의 APU/GPU 온도, 전력 등)
#  다른 위치/칩이면 아래처럼 덮어쓰면 돼. `sensors` 명령 결과의 칩 이름과 라벨을 적어.
# ---------------------------------------------------------------
# sensors:
#   apu_temp: { chip: k10temp, label: Tctl }
#   gpu_temp: { chip: amdgpu,  label: edge }
#   apu_power: { chip: amdgpu, label: PPT }

# ---------------------------------------------------------------
#  (선택) Agent 탭 — Hermes Agent 를 돌리는 서버에서만 켜. 아래 # 를 지우고 내 환경에 맞게 고쳐.
#  hermes.unit 이 있어야 Agent 탭이 나타나. 없으면 탭이 안 보이는 게 정상이야.
# ---------------------------------------------------------------
# hermes:
#   unit: hermes-gateway.service
#   scope: user
#   home: ~/.hermes                # gateway_state.json, state.db 가 있는 곳
#   log_window_hours: 6
#   bots:
#     thia:  { name: Thia, role: 비서, mattermost: thia }
#   # Mattermost 칩으로 폰·PC 앱의 대화방을 바로 열고 싶을 때 (화면의 ＋설정 창에서 적어도 돼. 여기 적으면 이 값이 우선이라 화면에서는 못 고쳐)
#   open:
#     server: mm.example.com         # Mattermost 앱에 등록된 서버 주소와 똑같이 (https:// 는 빼). 봇 이름이 아니야!
#     team: myteam                   # 브라우저 주소의 서버/팀이름/channels/... 에서 팀이름
